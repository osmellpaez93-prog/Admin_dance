<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://lhtfrzhwzphryjhgcqjw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxodGZyemh3enBocnlqaGdjcWp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzOTU3NDksImV4cCI6MjA4Njk3MTc0OX0.1HSklzboeOSAnCip3V39LcYZIJWLMZzgWuCvy7qBl2I';
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let users=[], niveles=[], clases=[], sueltos=[], access=[];

    loadData();

    function showTab(name) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${name}`).style.display = 'block';
        event.target.classList.add('active');
    }

    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = `message ${type}`;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 3000);
    }

    async function loadData() {
        try {
            const [u, n, c, s, a] = await Promise.all([
                supabaseClient.from('users').select('*').order('created_at', { ascending: false }),
                supabaseClient.from('niveles').select('*'),
                supabaseClient.from('clases').select('*'),
                supabaseClient.from('videos_sueltos').select('*'),
                supabaseClient.from('user_access').select('*')
            ]);
            
            users = u.data || [];
            niveles = n.data || [];
            clases = c.data || [];
            sueltos = s.data || [];
            access = a.data || [];

            document.getElementById('statUsers').textContent = users.length;
            document.getElementById('statNiveles').textContent = niveles.length;
            document.getElementById('statClases').textContent = clases.length;
            document.getElementById('statSueltos').textContent = sueltos.length;

            renderUsers();
            renderNiveles();
            renderClases();
            renderSueltos();
        } catch (err) {
            console.error('Error:', err);
        }
    }

    function renderUsers() {
        document.getElementById('usersTable').innerHTML = users.map(u => `
            <tr>
                <td><strong style="color:#f59e0b">${u.access_code||'-'}</strong></td>
                <td>${u.name||'-'}</td>
                <td>${u.phone||'-'}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editUser('${u.id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="del('users','${u.id}')">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    function renderNiveles() {
        document.getElementById('nivelesTable').innerHTML = niveles.map(n => `
            <tr>
                <td>${n.nombre||'-'}</td>
                <td>${n.tipo_baile||'-'}</td>
                <td>${n.nivel||'-'}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editNivel('${n.id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="del('niveles','${n.id}')">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    function renderClases() {
        document.getElementById('clasesTable').innerHTML = clases.map(c => `
            <tr>
                <td>${c.titulo||'-'}</td>
                <td>${c.nivel_id?.substring(0,8)||'-'}</td>
                <td>${c.video_url?.substring(0,30)||'-'}...</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editClase('${c.id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="del('clases','${c.id}')">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    function renderSueltos() {
        document.getElementById('sueltosTable').innerHTML = sueltos.map(s => `
            <tr>
                <td>${s.titulo||'-'}</td>
                <td>-</td>
                <td>${s.video_url?.substring(0,30)||'-'}...</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editSuelto('${s.id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="del('videos_sueltos','${s.id}')">🗑️</button>
                </td>
            </tr>
        `).join('');
    }

    // EDITAR USUARIO
    function editUser(id) {
        const user = users.find(u => u.id === id);
        if (!user) return;
        document.getElementById('editUserId').value = user.id;
        document.getElementById('editUserCode').value = user.access_code || '-';
        document.getElementById('editUserName').value = user.name || '';
        document.getElementById('editUserPhone').value = user.phone || '';
        openModal('modalEditUser');
    }

    document.getElementById('formEditUser').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('editUserId').value;
        const { error } = await supabaseClient.from('users').update({ 
            name: document.getElementById('editUserName').value,
            phone: document.getElementById('editUserPhone').value
        }).eq('id', id);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalEditUser'); loadData(); }
    });

    // EDITAR NIVEL
    function editNivel(id) {
        const nivel = niveles.find(n => n.id === id);
        if (!nivel) return;
        document.getElementById('editNivelId').value = nivel.id;
        document.getElementById('editNivelNombre').value = nivel.nombre || '';
        document.getElementById('editNivelTipo').value = nivel.tipo_baile || 'Salsa';
        document.getElementById('editNivelNivel').value = nivel.nivel || 'Principiante';
        openModal('modalEditNivel');
    }

    document.getElementById('formEditNivel').addEventListener('submit', async e => {
        e.preventDefault();
        const id = document.getElementById('editNivelId').value;
        const { error } = await supabaseClient.from('niveles').update({
            nombre: document.getElementById('editNivelNombre').value,
            tipo_baile: document.getElementById('editNivelTipo').value,
            nivel: document.getElementById('editNivelNivel').value
        }).eq('id', id);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalEditNivel'); loadData(); }
    });

    // EDITAR CLASE
    function editClase(id) {
        const clase = clases.find(c => c.id === id);
        if (!clase) return;
        document.getElementById('editClaseId').value = clase.id;
        document.getElementById('editClaseTitulo').value = clase.titulo || '';
        document.getElementById('editClaseDesc').value = clase.descripcion || '';
        document.getElementById('editClaseVideo').value = clase.video_url || '';
        document.getElementById('editClaseThumb').value = clase.thumbnail_url || '';
        openModal('modalEditClase');
    }

    document.getElementById('formEditClase').addEventListener('submit', async e => {
        e.preventDefault();
        const { error } = await supabaseClient.from('clases').update({
            titulo: document.getElementById('editClaseTitulo').value,
            descripcion: document.getElementById('editClaseDesc').value,
            video_url: document.getElementById('editClaseVideo').value,
            thumbnail_url: document.getElementById('editClaseThumb').value
        }).eq('id', document.getElementById('editClaseId').value);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalEditClase'); loadData(); }
    });

    // EDITAR VIDEO SUELTO - SIMPLIFICADO
    function editSuelto(id) {
        const suelto = sueltos.find(s => s.id === id);
        if (!suelto) return;
        document.getElementById('editSueltoId').value = suelto.id;
        document.getElementById('editSueltoTitulo').value = suelto.titulo || '';
        document.getElementById('editSueltoDesc').value = suelto.descripcion || '';
        document.getElementById('editSueltoVideo').value = suelto.video_url || '';
        document.getElementById('editSueltoThumb').value = suelto.thumbnail_url || '';
        openModal('modalEditSuelto');
    }

    document.getElementById('formEditSuelto').addEventListener('submit', async e => {
        e.preventDefault();
        const { error } = await supabaseClient.from('videos_sueltos').update({
            titulo: document.getElementById('editSueltoTitulo').value,
            descripcion: document.getElementById('editSueltoDesc').value,
            video_url: document.getElementById('editSueltoVideo').value,
            thumbnail_url: document.getElementById('editSueltoThumb').value
        }).eq('id', document.getElementById('editSueltoId').value);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalEditSuelto'); loadData(); }
    });

    // NUEVO USUARIO
    document.getElementById('newUserForm').addEventListener('submit', async e => {
        e.preventDefault();
        const name = document.getElementById('newUserName').value.trim();
        const phone = document.getElementById('newUserPhone').value.trim();
        let code, exists = true;
        while (exists) {
            code = 'SM' + Math.floor(10000 + Math.random() * 90000);
            const {data} = await supabaseClient.from('users').select('id').eq('access_code', code).single();
            if (!data) exists = false;
        }
        const {error} = await supabaseClient.from('users').insert([{name, phone, access_code: code}]);
        if (error) showMsg('newUserMsg', error.message, 'error');
        else {
            showMsg('newUserMsg', `✅ Código: ${code}`, 'success');
            document.getElementById('newUserForm').reset();
            loadData();
        }
    });

    // NUEVO NIVEL
    document.getElementById('formNivel').addEventListener('submit', async e => {
        e.preventDefault();
        const { error } = await supabaseClient.from('niveles').insert([{
            nombre: document.getElementById('nivelNombre').value,
            tipo_baile: document.getElementById('nivelTipo').value,
            nivel: document.getElementById('nivelNivel').value
        }]);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalNivel'); loadData(); }
    });

    // NUEVA CLASE
    document.getElementById('formClase').addEventListener('submit', async e => {
        e.preventDefault();
        const { error } = await supabaseClient.from('clases').insert([{
            titulo: document.getElementById('claseTitulo').value,
            descripcion: document.getElementById('claseDesc').value,
            video_url: document.getElementById('claseVideo').value,
            thumbnail_url: document.getElementById('claseThumb').value
        }]);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalClase'); loadData(); }
    });

    // NUEVO VIDEO SUELTO - SIMPLIFICADO
    document.getElementById('formSuelto').addEventListener('submit', async e => {
        e.preventDefault();
        const { error } = await supabaseClient.from('videos_sueltos').insert([{
            titulo: document.getElementById('sueltoTitulo').value,
            descripcion: document.getElementById('sueltoDesc').value,
            video_url: document.getElementById('sueltoVideo').value,
            thumbnail_url: document.getElementById('sueltoThumb').value
        }]);
        if (error) alert('Error: ' + error.message);
        else { closeModal('modalSuelto'); loadData(); }
    });

    // ACCESOS
    async function manageAccess(uid, name, code) {
        document.getElementById('accesosTitle').textContent = `${name} (${code})`;
        const userAcc = access.filter(a => a.user_id === uid).map(a => a.nivel_id);
        const current = niveles.filter(n => userAcc.includes(n.id));
        const available = niveles.filter(n => !userAcc.includes(n.id));
        
        let html = '<h4 style="color:#f59e0b;margin-bottom:0.5rem">Accesos Actuales</h4>';
        html += current.length ? current.map(n => `
            <div class="access-item">
                <span>${n.nombre}</span>
                <button class="btn btn-sm btn-danger" onclick="removeAccess('${uid}','${n.id}')">Quitar</button>
            </div>
        `).join('') : '<p style="color:#999">Sin accesos</p>';
        
        html += '<h4 style="color:#f59e0b;margin:1rem 0 0.5rem">Disponibles</h4>';
        html += available.length ? available.map(n => `
            <div class="access-item">
                <span>${n.nombre}</span>
                <button class="btn btn-sm btn-success" onclick="addAccess('${uid}','${n.id}')">Agregar</button>
            </div>
        `).join('') : '<p style="color:#999">No hay más</p>';
        
        document.getElementById('accesosBody').innerHTML = html;
        openModal('modalAccesos');
    }

    async function addAccess(uid, nid) {
        await supabaseClient.from('user_access').insert([{user_id: uid, nivel_id: nid}]);
        loadData();
        const u = users.find(x => x.id === uid);
        if (u) manageAccess(uid, u.name, u.access_code);
    }

    async function removeAccess(uid, nid) {
        if (!confirm('¿Quitar?')) return;
        await supabaseClient.from('user_access').delete().eq('user_id', uid).eq('nivel_id', nid);
        loadData();
        const u = users.find(x => x.id === uid);
        if (u) manageAccess(uid, u.name, u.access_code);
    }

    async function del(table, id) {
        if (!confirm('¿Eliminar?')) return;
        await supabaseClient.from(table).delete().eq('id', id);
        loadData();
    }

    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => {
        if (e.target === m) m.classList.remove('active');
    }));
</script>
