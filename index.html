<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Ven y Baila Lessons</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎭 Panel de Administración</h1>
        <p>Ven y Baila Lessons</p>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="stat-number" id="statUsers">0</div><div>Usuarios</div></div>
        <div class="stat-card"><div class="stat-number" id="statCategorias">0</div><div>Categorías</div></div>
        <div class="stat-card"><div class="stat-number" id="statClases">0</div><div>Clases</div></div>
        <div class="stat-card"><div class="stat-number" id="statSueltos">0</div><div>Videos Sueltos</div></div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('usuarios')">👥 Usuarios</button>
        <button class="tab" onclick="showTab('contenido')">📚 Contenido</button>
        <button class="tab" onclick="showTab('sueltos')">🎥 Videos Sueltos</button>
        <button class="tab" onclick="showTab('nuevo')">➕ Nuevo Usuario</button>
    </div>

    <!-- USUARIOS -->
    <div id="tab-usuarios" class="tab-content">
        <div class="section">
            <h3>Usuarios</h3>
            <table>
                <thead><tr><th>Código</th><th>Nombre</th><th>Teléfono</th><th>Accesos</th><th>Acciones</th></tr></thead>
                <tbody id="usersTable"></tbody>
            </table>
        </div>
    </div>

    <!-- CONTENIDO -->
    <div id="tab-contenido" class="tab-content" style="display:none;">
        <div class="section">
            <h3>Contenido por Categoría</h3>
            <div id="contenidoJerarquico"></div>
        </div>
    </div>

    <!-- VIDEOS SUELTOS -->
    <div id="tab-sueltos" class="tab-content" style="display:none;">
        <div class="section">
            <h3>Videos Sueltos <button class="btn btn-success btn-sm" onclick="openModal('modalSuelto')">+ Nuevo</button></h3>
            <table>
                <thead><tr><th>Título</th><th>URL</th><th>Acciones</th></tr></thead>
                <tbody id="sueltosTable"></tbody>
            </table>
        </div>
    </div>

    <!-- NUEVO USUARIO -->
    <div id="tab-nuevo" class="tab-content" style="display:none;">
        <div class="section">
            <h3>Crear Usuario</h3>
            <div id="newUserMsg" class="message"></div>
            <form id="newUserForm">
                <div class="form-row">
                    <div class="form-group"><label>Nombre</label><input type="text" id="newUserName" required></div>
                    <div class="form-group"><label>Teléfono</label><input type="tel" id="newUserPhone" required></div>
                </div>
                <button type="submit" class="btn btn-primary">Generar Código</button>
            </form>
        </div>
    </div>
</div>

<!-- MODALES -->
<div id="modalAccesos" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="accesosTitle">Gestionar Accesos</h3>
            <button class="close-btn" onclick="closeModal('modalAccesos')">&times;</button>
        </div>
        <div id="accesosInfo"></div>
        <div id="accesosPorCategoria"></div>
        <div style="margin-top:1rem; text-align:right;">
            <button class="btn btn-primary" onclick="saveAllAccess()">Guardar Cambios</button>
        </div>
    </div>
</div>

<div id="modalEditUser" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Editar Usuario</h3>
            <button class="close-btn" onclick="closeModal('modalEditUser')">&times;</button>
        </div>
        <form id="formEditUser">
            <input type="hidden" id="editUserId">
            <div class="form-group"><label>Código</label><input type="text" id="editUserCode" disabled></div>
            <div class="form-group"><label>Nombre</label><input type="text" id="editUserName" required></div>
            <div class="form-group"><label>Teléfono</label><input type="tel" id="editUserPhone" required></div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</div>

<div id="modalVideo" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="videoModalTitle">Video</h3>
            <button class="close-btn" onclick="closeModal('modalVideo')">&times;</button>
        </div>
        <form id="formVideo">
            <input type="hidden" id="videoId">
            <input type="hidden" id="videoNivelId">
            <div class="form-group"><label>Título</label><input type="text" id="videoTitulo" required></div>
            <div class="form-group"><label>Descripción</label><textarea id="videoDesc" rows="3"></textarea></div>
            <div class="form-row">
                <div class="form-group"><label>URL Video</label><input type="text" id="videoUrl" required></div>
                <div class="form-group"><label>URL Thumbnail</label><input type="text" id="videoThumb"></div>
            </div>
            <div class="form-group"><label>Orden</label><input type="number" id="videoOrden" value="1" min="1"></div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</div>

<div id="modalSuelto" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Video Suelto</h3>
            <button class="close-btn" onclick="closeModal('modalSuelto')">&times;</button>
        </div>
        <form id="formSuelto">
            <input type="hidden" id="sueltoId">
            <div class="form-group"><label>Título</label><input type="text" id="sueltoTitulo" required></div>
            <div class="form-group"><label>Descripción</label><textarea id="sueltoDesc" rows="3"></textarea></div>
            <div class="form-row">
                <div class="form-group"><label>URL Video</label><input type="text" id="sueltoVideo" required></div>
                <div class="form-group"><label>URL Thumbnail</label><input type="text" id="sueltoThumb"></div>
            </div>
            <div class="form-group"><label>Orden</label><input type="number" id="sueltoOrden" value="1" min="1"></div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
